version: '3.8'

services:
  # Base de données MongoDB
  mongodb:
    image: mongo:latest
    container_name: mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mern-data:/data/db
    networks:
      - mern-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Service Backend Express
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: server
    restart: always
    ports:
      - "9000:9000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/mern
      - PORT=9000
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - mern-network

  # Service Frontend React
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - REACT_APP_API_URL=http://localhost:9000
    container_name: client
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    networks:
      - mern-network

# Réseau partagé
networks:
  mern-network:
    driver: bridge

# Volume persistant pour MongoDB
volumes:
  mern-data:
    driver: local